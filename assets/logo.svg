const year = document.getElementById('year');

if (year) {
  year.textContent = new Date().getFullYear();
}

const faqButtons = document.querySelectorAll('.faq-item button');

faqButtons.forEach((button) => {
  const answer = button.nextElementSibling;

  button.addEventListener('click', () => {
    const isExpanded = button.getAttribute('aria-expanded') === 'true';

    faqButtons.forEach((itemButton) => {
      itemButton.setAttribute('aria-expanded', 'false');
      const itemAnswer = itemButton.nextElementSibling;
      if (itemAnswer) {
        itemAnswer.style.maxHeight = null;
      }
    });

    if (!isExpanded) {
      button.setAttribute('aria-expanded', 'true');
      if (answer) {
        answer.style.maxHeight = answer.scrollHeight + 'px';
      }
    }
  });
});

const initialFaq = document.querySelector('.faq-item button');
if (initialFaq) {
  initialFaq.setAttribute('aria-expanded', 'true');
  const firstAnswer = initialFaq.nextElementSibling;
  if (firstAnswer) {
    firstAnswer.style.maxHeight = firstAnswer.scrollHeight + 'px';
  }
}

const leadForm = document.getElementById('leadForm');
const statusEl = document.querySelector('.form-status');

if (leadForm) {
  leadForm.addEventListener('submit', (event) => {
    event.preventDefault();

    const formData = new FormData(leadForm);
    const name = String(formData.get('name') || '').trim();
    const email = String(formData.get('email') || '').trim();
    const itemType = String(formData.get('itemType') || '').trim();
    const message = String(formData.get('message') || '').trim();

    if (!name || !email || !itemType || !message) {
      if (statusEl) {
        statusEl.textContent = 'Please complete all fields before submitting.';
        statusEl.style.color = 'var(--danger)';
      }
      return;
    }

    if (!email.includes('@')) {
      if (statusEl) {
        statusEl.textContent = 'Please enter a valid email address.';
        statusEl.style.color = 'var(--danger)';
      }
      return;
    }

    if (statusEl) {
      statusEl.textContent = 'Thanks! Your request has been captured for follow-up.';
      statusEl.style.color = 'var(--success)';
    }

    leadForm.reset();
  });
}
